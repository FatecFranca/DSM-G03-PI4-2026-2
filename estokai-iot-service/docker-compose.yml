services:

  mqtt:
    image: eclipse-mosquitto:2.1.2
    container_name: estokai-mqtt
    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log

volumes:
  mqtt-data:
  mqtt-log:
